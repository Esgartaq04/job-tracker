name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, migrate, test
    runs-on: ubuntu-latest

    # The suite runs on SQLite by default; here it runs against the real engine so the
    # migration, the Postgres enum, and the tsvector search path are all covered.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
          POSTGRES_DB: job_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtracker"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Tests (SQLite)
        run: pytest -q

      - name: Tests (Postgres + migrations)
        env:
          DATABASE_URL: postgresql+psycopg://jobtracker:jobtracker@localhost:5432/job_tracker
        run: pytest -q

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
