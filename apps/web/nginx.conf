server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: every route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API so the browser sees one origin (SSE included).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-sent events must not be buffered or timed out at 60s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location = /healthz { proxy_pass http://api:8000/healthz; }
}
